add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

# Username module
[username]
show_always = true
style_user = "bg:#000000 fg:#00ff99"
style_root = "bg:#000000 fg:#ccffee"
format = '[$user ]($style)'
disabled = false

# Character module for the prompt symbol
[character]
success_symbol = '[➜](fg:#00ff99)'
error_symbol = '[✗](fg:#ccffee)'
vicmd_symbol = '[❮](fg:#00cc77)'

[directory]
# truncation_length = 2
# truncation_symbol = "…/"
repo_root_style = "bold fg:#00cc77"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
style = "fg:#00cc77"
format = "[ $path ]($style)"

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "fg:#00ff99"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

# Path substitutions for cleaner display
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Desktop" = "󰀾 "
"Videos" = "󰕧 "
"Public" = "󰐕 "
"Templates" = "󰏗 "

# Docker context
[docker_context]
symbol = "󰡨 "
style = "bg:#ccffee fg:#000000"
format = '[ $symbol $context ]($style)'

# Git branch
# [git_branch]
# symbol = "󰘬"
# style = "bg:#00ff99 fg:#000000"
# format = '[ $symbol $branch ]($style)'
#
# # Git status
# [git_status]
# style = "bg:#00ff99 fg:#000000"
# format = '[$all_status$ahead_behind ]($style)'

# Programming language modules
[golang]
symbol = "󰟓 "
style = "bg:#383838 fg:#00ff99"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#383838 fg:#00ff99"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = "󰸭 "
style = "bg:#383838 fg:#00ff99"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = "󰌞󰛦"
style = "bg:#383838 fg:#00ff99"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = "󱘗"
style = "bg:#383838 fg:#00ff99"
format = '[ $symbol ($version) ]($style)'

[python]
version_format = "${raw}"
symbol = " 🐍 "
style = "bg:#383838 fg:#00ff99"
format = '[${symbol}${version} 󰌠($virtualenv)󰌠 ]($style)'
