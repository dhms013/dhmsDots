[main]
include=~/.config/themes/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=7.5
pad=14x14
initial-window-mode=windowed
workers=0

[colors]
alpha=0.8

[scrollback]
lines=10000

[cursor]
style=beam
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
