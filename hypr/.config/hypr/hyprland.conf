source = ./envs.conf
source = ./input.conf
source = ./keybindings.conf
source = ./looknfeel.conf
source = ./monitors.conf

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrulev2 = float,class:^(imv)$
windowrulev2 = float,class:^(mpv)$
windowrulev2 = size 800 600, class:.*
windowrulev2 = opacity 1 override,class:zen
windowrulev2 = opacity 1 override,title:nvim
windowrulev2 = opacity 1 override,class:mpv
windowrulev2 = opacity 1 override,title:Where Winds Meet
