#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 1
    gaps_out = 1
    border_size = 3
    resize_on_border = true
    extend_border_grab_area = 15
    allow_tearing = false
    layout = dwindle
}

decoration {
    # rounding = 10
    # rounding_power = 2
    active_opacity = 0.8
    inactive_opacity = 0.8
    fullscreen_opacity = 1

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1a99)
        offset = 0 0
    }
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    force_split = 2
}

# See https://wiki.hypr.land/Configuring/Scrolling-Layout/ for more
scrolling {
    fullscreen_on_one_column = false
  }

animations {
    enabled = yes
    bezier = village, 0.22, 1, 0.36, 1

    animation = windows,     1, 5, village, slide
    animation = windowsIn,   1, 5, village, slide
    animation = windowsOut,  1, 4, village, slide
    animation = windowsMove, 1, 5, village
    animation = fade,        1, 4, village
    animation = fadeIn,      1, 4, village
    animation = fadeOut,     1, 3, village
    animation = layers,      1, 4, village
    animation = layersIn,    1, 4, village
    animation = layersOut,   1, 3, village
    animation = workspaces,  1, 6, village, slide

    bezier = borderEase, 0.22, 1, 0.36, 1
    animation = border, 1, 6, borderEase
}
