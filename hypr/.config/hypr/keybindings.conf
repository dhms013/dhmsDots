###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# "Windows" key swapped with "ALT" keys. Check ./input.conf to change it

bindd = $mainMod, RETURN, Terminal, exec, $terminal
bindd = $mainMod SHIFT, RETURN, Sub-Terminal, exec, kitty
bindd = $mainMod, Escape, power-menu, exec, ~/.config/scripts/power-menu
bindd = $mainMod, Q, Quit, killactive,
bindd = $mainMod CTRL, L, Lock screen, exec, hyprlock
bindd = $mainMod, T, Toogle Floating, togglefloating,
bindd = $mainMod, SPACE, Menu, exec, $menu
bindd = $mainMod CTRL, SPACE, Background, exec, waypaper
bindd = $mainMod, P, Pseudo,pseudo, # dwindle
bindd = $mainMod SHIFT, P, Toogle Split, togglesplit, # dwindle
bindd = $mainMod, B, bluetooth, exec, [float; max_size 800 600] $terminal -e bluetui
bindd = $mainMod, W, Audio, exec, [float; max_size 800 600] $terminal -e wiremix
bindd = $mainMod SHIFT, T, Telegram, exec, Telegram
bindd = $mainMod SHIFT, D, Discord, exec, discord
bindd = $mainMod SHIFT, W, WhatsApp, exec, "/opt/WhatsApp Desktop/whatsapp-linux-desktop"
bindd = $mainMod SHIFT, B, browser,exec, $browser
bindd = $mainMod SHIFT ALT, B, Sub-Browser, exec, $browser -P umbeldisco
bindd = $mainMod SHIFT, F, File Manager, exec, $fileManager
bindd = $mainMod SHIFT, N, Editor, exec, $terminal --title=nvim -e nvim
bindd = $mainMod, C, Copy, sendshortcut, CTRL, insert, activewindow
bindd = $mainMod, V, Paste, sendshortcut, SHIFT, insert, activewindow
bindd = $mainMod, X, Cut, sendshortcut, CTRL, X, activewindow
bindd = $mainMod SHIFT, slash, keybinds, exec, ~/.config/scripts/keybinds

# Screen capture
bindd = , Print, Screenshot, exec, ~/.config/scripts/screenshot
bindd = SHIFT, Print, Screenshot (clipboard), exec, ~/.config/scripts/screenshot msart clipboard
bindd = ALT, Print, Screenrecord, exec, ~/.config/scripts/screenrecord

# Move focus with mainMod + VIM motion
bindd = $mainMod, H, Move Focus Left, movefocus, l
bindd = $mainMod, L, Move Focus Right, movefocus, r
bindd = $mainMod, K, Move Focus Top, movefocus, u
bindd = $mainMod, J, Move Focus Bottom, movefocus, d

# Swap active window with the one next to it with $mainMod + SHIFT + VIM motion
bindd = $mainMod SHIFT, H, Swap Window Left, swapwindow, l
bindd = $mainMod SHIFT, L, Swap Window Right, swapwindow, r
bindd = $mainMod SHIFT, K, Swap Window Top, swapwindow, u
bindd = $mainMod SHIFT, J, Swap Window Bottom, swapwindow, d

# Resize active window shortcut
bindd = $mainMod, code:20, Expand Left Window, resizeactive, -100 0 # - key
bindd = $mainMod, code:21, Expand Right Window, resizeactive, 100 0 # = key
bindd = $mainMod SHIFT, code:21, Expand Top Window, resizeactive, 0 100  # + key
bindd = $mainMod SHIFT, code:20, Expand Bottom Window, resizeactive, 0 -100  # _ key

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, Switch Workspace 1, workspace, 1
bindd = $mainMod, 2, Switch Workspace 2, workspace, 2
bindd = $mainMod, 3, Switch Workspace 3, workspace, 3
bindd = $mainMod, 4, Switch Workspace 4, workspace, 4
bindd = $mainMod, 5, Switch Workspace 5, workspace, 5
bindd = $mainMod, 6, Switch Workspace 6, workspace, 6
bindd = $mainMod, 7, Switch Workspace 7, workspace, 7
bindd = $mainMod, 8, Switch Workspace 8, workspace, 8
bindd = $mainMod, 9, Switch Workspace 9, workspace, 9
bindd = $mainMod, 0, Switch Workspace 10, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, 1, Move Window To Workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move Window To Workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move Window To Workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move Window To Workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move Window To Workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move Window To Workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move Window To Workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move Window To Workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move Window To Workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move Window To Workspace 10, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = $mainMod, mouse:272, Move Window, movewindow
bindmd = $mainMod, mouse:273, Resize Window, resizewindow

# Volume Control
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# Brightness Control
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
