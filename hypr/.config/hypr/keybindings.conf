###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# "Windows" key swapped with "ALT" keys. Check ./input.conf to change it

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Escape, exec, ~/.config/scripts/power-menu
bind = $mainMod, Q, killactive,
bind = $mainMod CTRL, L, exec, hyprlock
bind = $mainMod, T, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod CTRL, SPACE, exec, waypaper
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod SHIFT, P, togglesplit, # dwindle
bind = $mainMod, B, exec, [float] $terminal -e bluetui
bind = $mainMod, W, exec, [float] $terminal -e wiremix
bind = $mainMod SHIFT, T, exec, Telegram
bind = $mainMod SHIFT, D, exec, discord
bind = $mainMod SHIFT, W, exec, "/opt/WhatsApp Desktop/whatsapp-linux-desktop"
bind = $mainMod SHIFT, B, exec, $browser
bind = $mainMod SHIFT ALT, B, exec, $browser -P umbeldisco
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod SHIFT, N, exec, $terminal --title=nvim -e nvim
bind = $mainMod, C, sendshortcut, CTRL, insert, activewindow
bind = $mainMod, V, sendshortcut, SHIFT, insert, activewindow
bind = $mainMod, X, sendshortcut, CTRL, X, activewindow

# Screen capture
bind = , Print, exec, ~/.config/scripts/screenshot
bind = SHIFT, Print, exec, ~/.config/scripts/screenshot msart clipboard
bind = ALT, Print, exec, ~/.config/scripts/screenrecord

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Swap active window with the one next to it with $mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

# Resize active window shortcut
bind = $mainMod, code:20, resizeactive, -100 0 # - key
bind = $mainMod, code:21, resizeactive, 100 0 # = key
bind = $mainMod SHIFT, code:20, resizeactive, 0 -100
bind = $mainMod SHIFT, code:21, resizeactive, 0 100

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume Control
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# Brightness Control
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
