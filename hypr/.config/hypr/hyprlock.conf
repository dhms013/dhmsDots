$inner_color = rgba(0,0,0,0.8)
$outer_color = rgba(0,255,153,1.0)
$font_color = rgba(0,255,153,1.0)
$check_color = rgba(0,204,119,1.0)
$placeholder_color = rgba(0,255,153,0.6)
$color = rgba(0,0,0,1.0)
$actual_inner_color = rgba(0,255,153,0.6)
$actual_font_color = rgb(168, 230, 161)
$actual_check_color = rgba(0,204,119,1.0)
$accent_color = rgb(137, 246, 196)
$error_color = rgb(224, 108, 117)
$warning_color = rgb(229, 192, 123)
$muted_color = rgb(150, 210, 145)
$shadow_color = rgba(10, 46, 10, 0.4)

general {
    disable_loading_bar = false
    grace = 2
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
}

background {
    monitor =
    color = $color
    path = ~/Pictures/backgrounds/2-osaka-jade-bg.jpg
    blur_passes = 0
}

animations {
    enabled = true
}

input-field {
    monitor =
    size = 280, 50
    position = 0, -300
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 3

    font_family = BitstromWera Nerd Font
    font_color = $font_color

    # placeholder_text = <span> Enter Password 󰈷 </span>
    placeholder_text = <span> Enter Password </span>
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 30
    shadow_passes = 0
    fade_on_empty = true
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $actual_font_color
    font_size = 120
    font_family = Liberation Sans
    position = 0, 0
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.25)
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %B %d")"
    color = $muted_color 
    font_size = 22
    font_family = Liberation Sans
    position = 0, -100
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow_color 
    halign = center
    valign = center
}
