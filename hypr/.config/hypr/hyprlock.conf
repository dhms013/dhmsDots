source = ~/.config/themes/current/theme/hyprlock.conf
$error_color = rgb(224, 108, 117)
$shadow_color = rgba(10, 46, 10, 0.4)

general {
    hide_cursor = true
    ignore_empty_input = false
}

background {
    monitor =
    color = $color
    path = ~/.config/themes/current/background
    blur_passes = 0
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 280, 50
    position = 0, -300
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 3

    font_family = BitstromWera Nerd Font
    font_color = $font_color

    # placeholder_text = <span> Enter Password 󰈷 </span>
    placeholder_text = <span> Enter Password 󰈷 </span>
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 30
    shadow_passes = 0
    fade_on_empty = true
}

auth {
    fingerprint:enabled = true
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $outer_color
    font_size = 120
    font_family = Liberation Sans
    position = 0, 0
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.25)
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %B %d")"
    color = $outer_color
    font_size = 22
    font_family = Liberation Sans
    position = 0, -100
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow_color 
    halign = center
    valign = center
}
