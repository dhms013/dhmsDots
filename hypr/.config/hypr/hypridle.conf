general {
    lock_cmd = dhms-lock
    # on_unlock_cmd = restart-quickshell
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on && hyprctl reload; restart-services hyprlock
    inhibit_sleep = 1
}

listener {
    timeout = 299
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

listener {
    timeout = 300
    on-timeout = setup-screen off
    on-resume = setup-screen on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
