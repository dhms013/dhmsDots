general {
    lock_cmd = dhms-lock
    on_unlock_cmd = restart-services quickshell
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on && hyprctl reload; restart-services hyprlock
    inhibit_sleep = 1
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 310
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

listener {
    timeout = 310
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
