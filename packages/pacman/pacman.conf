# See the pacman.conf(5) manpage for option and repository directives

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 10
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Third-party build of tools that dhms uses (hermes-desktop, quickshell-git,
# ...). Deliberately LAST: official repos always win; omarchy only fills gaps.
# Key 40DFB630FF42BCFFB047046CF0134EE680CAC571 must be lsign'd in the keyring
# (see bin/keyrings) before the repo can be used.
#
# NO per-repo SigLevel: the mirror does not publish omarchy.db.sig, so the
# repo inherits the global "Required DatabaseOptional" (packages must be
# signed+trusted, the database may be unsigned). A stricter per-repo value
# here breaks `pacman -Sy` for every repo, not just omarchy.
[omarchy]
Server = https://pkgs.omarchy.org/stable/$arch
