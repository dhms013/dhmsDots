// dhms Zen live theme loader. Loaded by Firefox AutoConfig with chrome privileges.
(function () {
  var Cc = Components.classes;
  var Ci = Components.interfaces;
  var serviceScope = {};
  Components.utils.import("resource://gre/modules/Services.jsm", serviceScope);
  var Services = serviceScope.Services;
  if (Services.appinfo.processType !== Services.appinfo.PROCESS_TYPE_DEFAULT) return;
  var cacheFile = Services.dirsvc.get("Home", Ci.nsIFile);
  cacheFile.append(".cache");
  cacheFile.append("dhms");
  cacheFile.append("zen-live");
  cacheFile.append("zen.css");

  function restoreCommittedTheme() {
    var committed = Services.dirsvc.get("Home", Ci.nsIFile);
    committed.append(".config");
    committed.append("themes");
    committed.append("current");
    committed.append("theme");
    committed.append("zen.css");
    if (!committed.exists() || !committed.isFile()) return;
    try {
      var parent = cacheFile.parent;
      if (!parent.parent.exists()) parent.parent.create(Ci.nsIFile.DIRECTORY_TYPE, 0o700);
      if (!parent.exists()) parent.create(Ci.nsIFile.DIRECTORY_TYPE, 0o700);
      var temp = parent.clone();
      temp.append(".zen.css-startup");
      if (temp.exists()) temp.remove(false);
      committed.copyTo(parent, temp.leafName);
      if (cacheFile.exists()) cacheFile.remove(false);
      temp.moveTo(parent, "zen.css");
      cacheFile = parent.clone();
      cacheFile.append("zen.css");
    } catch (e) {
      log("could not restore committed CSS: " + e);
    }
  }

  var sheetService = Cc["@mozilla.org/content/style-sheet-service;1"]
    .getService(Ci.nsIStyleSheetService);
  var io = Services.io;
  var sheetUri = null;
  var lastSignature = "";
  var lastDiagnostic = "";
  var timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);

  function log(message) {
    try { Services.console.logStringMessage("dhms Zen theme: " + message); } catch (e) {}
  }

  function readTheme() {
    try {
      if (!cacheFile.exists() || !cacheFile.isFile()) return null;
      var stream = Cc["@mozilla.org/network/file-input-stream;1"]
        .createInstance(Ci.nsIFileInputStream);
      stream.init(cacheFile, 0x01, 0, 0);
      var scriptable = Cc["@mozilla.org/scriptableinputstream;1"]
        .createInstance(Ci.nsIScriptableInputStream);
      scriptable.init(stream);
      var css = scriptable.read(scriptable.available());
      scriptable.close();
      stream.close();
      var depth = 0;
      for (var i = 0; i < css.length; i++) {
        if (css.charAt(i) === "{") depth++;
        if (css.charAt(i) === "}" && --depth < 0) throw new Error("CSS braces are unbalanced");
      }
      if (!css || css.length > 262144 || depth !== 0 ||
          css.indexOf("Generated by theme-template") === -1 || css.indexOf("{{") !== -1 ||
          /<\s*script|@import/i.test(css)) {
        throw new Error("CSS failed validation");
      }
      return { css: css, signature: cacheFile.lastModifiedTime + ":" + cacheFile.fileSize + ":" + css.length };
    } catch (e) {
      var message = String(e);
      if (message !== lastDiagnostic) log("keeping last valid stylesheet; " + message);
      lastDiagnostic = message;
      return null;
    }
  }

  function refresh() {
    var content = readTheme();
    if (!content || content.signature === lastSignature) return;
    var temp = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    temp.initWithPath(cacheFile.path);
    var uri = io.newURI(io.newFileURI(temp).spec + "?dhms=" + content.signature.replace(/[^a-zA-Z0-9]/g, ""));
    try {
      sheetService.loadAndRegisterSheet(uri, sheetService.AGENT_SHEET);
      var previous = sheetUri;
      sheetUri = uri;
      if (previous && sheetService.sheetRegistered(previous, sheetService.AGENT_SHEET))
        sheetService.unregisterSheet(previous, sheetService.AGENT_SHEET);
      lastSignature = content.signature;
      lastDiagnostic = "";
      log("loaded live stylesheet");
    } catch (e) {
      var failure = String(e);
      if (failure !== lastDiagnostic) log("stylesheet rejected; keeping last valid stylesheet: " + failure);
      lastDiagnostic = failure;
    }
  }

  restoreCommittedTheme();
  refresh();
  timer.initWithCallback({ notify: refresh }, 500, Ci.nsITimer.TYPE_REPEATING_SLACK);
})();
