general {
    gaps_in = 1
    gaps_out = 1
    border_size = 3
    col.active_border = rgba(00ff99ff) rgba(00cc77ff) rgba(00ff99ff) rgba(000000ff) 45deg
    col.inactive_border = rgba(1a1a1aaa)
    resize_on_border = true
    extend_border_grab_area = 15
    allow_tearing = false
    layout = dwindle
}
decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 0.8
    inactive_opacity = 0.8
    fullscreen_opacity = 1

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1a99)
        offset = 0 0
    }
}
