sort=-time
max-history=10

font=JetBrainsMono Nerd Font 11
background-color=#282828
text-color=#dcdcdc
width=350
height=150
margin=10
padding=15
border-size=2
border-color=#a970dc
border-radius=16
icons=1
max-icon-size=48
default-timeout=5000
ignore-timeout=0

format=<b>%s</b>\n%b
group-by=app-name

[urgency=low]
background-color=#282828
border-color=#a970dc
text-color=#dcdcdc

[urgency=normal]
background-color=#282828
border-color=#a970dc
text-color=#dcdcdc

[urgency=critical]
background-color=#282828
border-color=#a970dc
text-color=#dcdcdc
default-timeout=0

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
