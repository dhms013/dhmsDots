# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.


general {
    col.active_border = rgba(a970dcdc) rgba(00000000) rgba(a970dcdc) rgba(a970dcdc) rgba(00000000) rgba(a970dcdc) 45deg
    col.inactive_border = rgba(c2a4db70)
}

group {
    col.border_active = rgba(a970dcdc)
    col.border_inactive = rgba(c2a4db70)
    drag_into_group = 2 # Only when dragging into groupbar
    merge_groups_on_drag = false
    merge_groups_on_groupbar = true

    groupbar {
        col.active = rgba(a970dc70)
        col.inactive = rgba(28282870)
        text_color = rgba(dcdcdcdc)
        text_color_inactive = rgba(a970dc70)
        gradients = true
        gradient_rounding = 16
    }
}

# Window Style
decoration {
    # orig
    rounding = 16
    active_opacity = 0.862745
    inactive_opacity = 0.439215
    fullscreen_opacity = 1.0
    dim_special = 0

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(2a1c37dc)
        color_inactive = rgba(2a1c37dc)
    }
# ✅ Blur (new syntax)
    blur {
        enabled = true
        special = true
        new_optimizations = true
        ignore_opacity = true
        passes = 3
        size = 7
        noise = 0.0117
        contrast = 0.8916
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
    }
}

animations {
    enabled = true
    bezier = mycurve, 0.2, 0, 0.5, 0.8
    animation = windows, 1, 2, mycurve, popin
    animation = border, 1, 2, mycurve
    animation = fade, 1, 2, mycurve
    animation = workspaces, 1, 2, mycurve, slide
    bezier = anglelinear, 0, 0, 1, 1
    animation = borderangle, 1, 100, anglelinear, loop
}

misc {
    disable_hyprland_logo = true
    font_family = 'JetBrainsMono Nerd Font'
}

layerrule = blur 0.862745, match:namespace walker
